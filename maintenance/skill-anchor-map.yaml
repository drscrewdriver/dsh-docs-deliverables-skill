  # ───────────────────────── surface-* ：设置面接线与样式（2026-11-26 立）
  # 起源：dsh-manage-session 2.0.26 四类实机故障（列数不生效 / 家族 tab 开关不接线 /
  # star 行退化 / 设置卡样式错乱）。证据一律取自桌面 app.asar 实读。
  # asar 读法：u32@4 = headerSize；JSON 从 offset 16 起、长度 headerSize-8；
  #            数据区起点 = 16 + (headerSize-8)，故 file bytes = dataStart + entry.offset。

  surface-host-writable-always-true:
    source: skills/dsh-plugin-dev/references/settings-surface-wiring.md §1.1/§1.3
    evidence:
      - "ASAR: @deepseek-ai/dsh-settings/src/index.ts  # `get writable(): boolean { return true }`"
      - "ASAR: 同文件 describe()  # ns = entry.options.id；volatileForm(schema) undefined 的 entry 直接不进结果"
      - "ASAR: 同文件 write()     # `expected !== undefined && descriptor.revision !== expected` 才抛冲突"
      - "ASAR: 同文件 volatileForm(form) undefined 分支 # 抛 `Plugin entry \"<ns>\" has no volatile fields`"
    status: VERIFIED   # 2026-11-26 asar 实读；「宿主不存在只读模式」由此成立
