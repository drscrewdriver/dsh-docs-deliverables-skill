# skill-anchor-map —— DSH 文档 skill 化的防腐化唯一闸
# 结构: claim_id → source(原文档§位置) → evidence(file:line@宿主版本 | 复现命令) → status
# status: VERIFIED(源码命中) / FARM(farm 实测,静态源码不可复核) / PENDING(待核) / CONFLICT-ADJUDICATED(已裁决) / UNVERIFIED(保留不收录正文)
# 复核纪律: 宿主每升 rc 后逐条重跑 evidence;未命中→对应 skill 段落加「⚠ 待重新核实 <date>」
# 基准: MAIN=deepseek-harness(0.2.0-rc.2, 含 dsh-v0.2.1-alpha.1..5/rc.1/rc.2/rc.3/rc.4 全 tag，0.2.1 线探针直接 git show/grep <tag>；rc.4=最新 tag 504a01a957、≠ master tip，2026-10-28 补拉) / AUX=.harness-017rc2-wt(0.1.7-rc.2) / OLD=dsh-repo(0.1.5-rc.2)
# 建档: 2026-10-11 ｜ 0.2.1 线追加: 2026-10-17

meta:
  # <ws> = 本知识库所在工作区/仓库根目录（可移植路径占位，不保留任何机器绝对地址）
  baselines:
    main: { path: "<ws>/deepseek-harness", version: 0.2.0-rc.2, git: true, role: 含 0.2.1 线全 tag（a.1..rc.4，rc.4=最新 tag、≠ master tip），符号级/闸门探针用 git show|grep <tag> 即得 }
    aux:  { path: "<ws>/.harness-017rc2-wt", version: 0.1.7-rc.2, git: true }
    old:  { path: "<ws>/dsh-repo", version: 0.1.5-rc.2, git: true }
    snapshot-study-docs: { path: "<ws>/dsh-study-docs/deepseek-harness", version: 0.1.0-rc.5, git: false, role: 引用坐标不作判据 }

claims:
  gate-engines-dsh-era:
    source: 官方指南 docs/upgrade-guide/v0.2.1-alpha.3/plugin-engines-dsh（宿主 tag dsh-v0.2.1-alpha.4）
    evidence:
      - MAIN: git diff dsh-v0.2.1-alpha.3 dsh-v0.2.1-alpha.4 -- packages/boot/app-boot/src/plugin-compatibility.ts  # +43/−29：unmetRequirements()；engines.dsh 存在即单独裁决
      - MAIN: git grep -n requirements dsh-v0.2.1-alpha.4 -- packages/boot/app-boot/src/plugin-compatibility.ts    # PluginCompatibility.peers→requirements 改名
      - MAIN: git show dsh-v0.2.1-alpha.5:packages/boot/app-boot/src/plugin-compatibility.ts                      # a.4→a.5、a.5→rc.1 闸门零 diff（时代边界只在 a.3/a.4 之间）
      - MAIN: git diff --stat dsh-v0.2.1-rc.1 dsh-v0.2.1-rc.2 -- packages/boot/app-boot/src/plugin-compatibility.ts  # rc.2 仍零 diff（master tip=rc.2，2026-10-17 核）
    status: VERIFIED           # 2026-10-17 新立；⚠ 本 claim 反转 gate-peer-only-authority 的适用边界（仅≤0.2.1-alpha.3 继续成立）
    feeds: [peer-adapt SKILL 核心定论1, VD-020-021-01, host-matrix dsh-0.2.1-* 条目, plugin-framework/v0.2.1-migration.md §0]

  gate-peer-only-authority:
    source: 既有记忆/旧文档冲突项(裁决见 adjudications.gate-surface)
    # ⚠ 适用边界 2026-10-17：本裁决仅对 ≤0.2.1-alpha.3 宿主继续成立；≥0.2.1-alpha.4 起 engines.dsh 被闸门读取（见 gate-engines-dsh-era）
    evidence:
      - AUX: packages/boot/app-boot/src/plugin-compatibility.ts:61-88   # 只读 manifest.peerDependencies
      - AUX: packages/boot/app-boot/src/plugin-compatibility.ts:75       # 仅 @deepseek-ai/dsh / @deepseek-ai/dsh-* 前缀
      - AUX: packages/boot/app-boot/src/plugin-compatibility.ts:77       # semver.satisfies(…, includePrerelease:true)
      - AUX: packages/boot/app-boot/src/plugin-compatibility.ts:101      # 豁免通道 dsh plugin allow-version
      - MAIN: 同文件同语义(callers: app-boot/profile.ts:675, plugin-manager/operations.ts:344,479, index.ts:301,546,722)
    status: CONFLICT-ADJUDICATED   # engines.dsh 与 dsh.plugin.json 均不在 runtime 门禁面;双清单不一致=元数据卫生级(P2)
    feeds: [peer-adapt SKILL 双闸门, gate-checklist 分级, VD 卡「老线装不上」处方]

