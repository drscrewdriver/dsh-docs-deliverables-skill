# B. host-matrix.yaml —— DSH 宿主七线能力矩阵（草案 v0.1）
# 数据源：10 号手册 §1/§2 + mine-dsh-plugins/host-matrix-rollout.md + enum-peer-migration/INDEX.md §A
#         + settings-registration-migration.md §1.1；断代数字来自 MAIN(deepseek-harness, git 仓 26 个 dsh-v* tag)
#         的 `git grep -l <pat> <tag> -- packages|vendor|apps` 文件数探针（下称「探针」）。
# 证据等级约定：VERIFIED=三基线/tag 探针源码锚定 | FARM=仅六线保留场实测 | PENDING=待证/两说并存 | UNVERIFIED=文档口径未核到
# ⚠️ FARM 假满足警示（全局适用）：farm 是共享工作格的六线常驻沙盒，跨格 peer hoist 会让「某线本不具备的能力」
#    在实测中显示可用；凡 marked: FARM 的格，结论只能证「测过的那一格当时可用」，不得外推为该线能力。
# 六线定义遵守定谳事实 6：0.1.0-rc.8 / 0.1.1-rc.2 / 0.1.2-rc.1 / 0.1.5-rc.3 / 0.1.7-rc.2 / 0.2.0-rc.2。

meta:
  generated_for: skill-drafts (单一真源三件套 B)
  baselines:
    MAIN: <ws>/deepseek-harness      # 0.2.0-rc.2，git 仓，可 tag 探针
    AUX:  <ws>/.harness-017rc2-wt    # 0.1.7-rc.2
    OLD:  <ws>/dsh-repo              # 0.1.5-rc.2（文档口径为 0.1.5-rc.3 线）
    # <ws> = 本知识库所在工作区根目录（可移植占位）
  probe_metric: "git grep -l <pattern> <tag> 命中文件数（源码级存在性，不证运行时渲染）"
  gate_source: "packages/boot/app-boot/src/plugin-compatibility.ts:61-88@0.1.7-rc.2+0.2.0-rc.2"
  invariants:
    - "跨线解锁唯一开关 = 放宽 package.json peerDependencies range；engines.dsh / dsh.plugin.json / dependencies 均不被闸门读取"
    - "适配分派只允许 typeof / inject 能力探测，禁止读宿主版本号（10 号手册:9-10）"
    - "settings.register() 作为服务方法三代均不存在（OLD settings/src/index.ts:445 系错误标签模板，:472 为 installSection 定义）"

columns:
  - settings_registration_api     # 设置注册面形状（第 1/2/3 代 waist）
  - client_card_seat              # client 卡片/配置席位面
  - host_settings_page            # 有无宿主自带设置页
  - gate_peer_range_semantics     # 兼容性闸门读到的 peer 段位口径
  - key_package_names             # 关键包名差异

