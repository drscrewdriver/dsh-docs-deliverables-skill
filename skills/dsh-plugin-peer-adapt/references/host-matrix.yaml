# B. host-matrix.yaml —— DSH 宿主七线能力矩阵（草案 v0.1）
# 数据源：10 号手册 §1/§2 + mine-dsh-plugins/host-matrix-rollout.md + enum-peer-migration/INDEX.md §A
#         + settings-registration-migration.md §1.1；断代数字来自 MAIN(deepseek-harness, git 仓 26 个 dsh-v* tag)
#         的 `git grep -l <pat> <tag> -- packages|vendor|apps` 文件数探针（下称「探针」）。
# 证据等级约定：VERIFIED=三基线/tag 探针源码锚定 | FARM=仅六线保留场实测 | PENDING=待证/两说并存 | UNVERIFIED=文档口径未核到
# ⚠️ FARM 假满足警示（全局适用）：farm 是共享工作格的六线常驻沙盒，跨格 peer hoist 会让「某线本不具备的能力」
#    在实测中显示可用；凡 marked: FARM 的格，结论只能证「测过的那一格当时可用」，不得外推为该线能力。
# 六线定义遵守定谳事实 6：0.1.0-rc.8 / 0.1.1-rc.2 / 0.1.2-rc.1 / 0.1.5-rc.3 / 0.1.7-rc.2 / 0.2.0-rc.2。
# 2026-10-17 增补 0.2.1 线两档（alpha.3 = 纯 peer 时代尾声；rc.1 = engines.dsh 时代现职尾版）与探针行。**0.2.1 线于本版后追加（a.3/a.5/rc.1 探针已入）**。
# 2026-10-24 追加 dsh-0.2.1-rc.3（导航条目自定义车：slot +3；New Session 空白复用带官方指南 1 篇；DeepSeek 跟官方 /models）卡片与探针行。
# 2026-10-28 追加 dsh-0.2.1-rc.4（纯修复车：页签 tooltip 估算溢出才挂 + More 文案静态化（locale 键 session.moreViewsCurrent 删）；ACP stdout 保留×2；契约面零 diff）卡片与探针行。
# 2026-10-28 二轮动态：dsh-v0.2.2-alpha.2（`f3803c9697`，= master tip，npm 挂 `alpha` 标）已发——0.2.2 线首 tag，**alpha.1 在 git/npm 均不存在**；换代段（树级 7242 files；commit 数浅克隆下不可考），首批探针：闸门两文件零 diff、SESSION_FORMAT_VERSION 仍 4、capability-seams +50（forge/liveshare/action-cards 等新缝族）、≥26 新包、指南补挂 +39 篇；**断裂面未逐主题析，未建卡不入矩阵——跟进 0.2.2 线前勿盲补枚举**（详见 source-analysis/v0.2.2-alpha.2/README.md）；现尾版=rc.4（0.2.1 线）。

